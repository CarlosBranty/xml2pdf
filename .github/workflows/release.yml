name: Release

# Publishes the command line binaries and the desktop installers when a
# version tag such as `v0.1.0` is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: xml2pdf }
          - { os: macos-latest, target: aarch64-apple-darwin, binary: xml2pdf }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: xml2pdf.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --package xml2pdf-cli --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          mkdir release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" LICENSE README.md release/
          tar -czf "xml2pdf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C release .
      - uses: softprops/action-gh-release@v2
        with:
          files: xml2pdf-*.tar.gz

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the interface embedded in the app
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)"
          cargo install wasm-bindgen-cli --locked --version "$version"
          ./scripts/build-desktop-ui.sh
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: xml2pdf ${{ github.ref_name }}
