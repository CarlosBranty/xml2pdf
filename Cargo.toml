[workspace]
resolver = "3"
members = [
    "crates/xml2pdf-core",
    "crates/xml2pdf-render",
    "crates/xml2pdf-cli",
    "crates/xml2pdf-wasm",
    "crates/xml2pdf-auto",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/xml2pdf-core",
    "crates/xml2pdf-render",
    "crates/xml2pdf-cli",
    "crates/xml2pdf-auto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xml2pdf/xml2pdf"
description = "Convert SUNAT electronic documents (UBL 2.1 XML) into printable PDFs"

[workspace.dependencies]
xml2pdf-core = { path = "crates/xml2pdf-core" }
xml2pdf-render = { path = "crates/xml2pdf-render" }
xml2pdf-auto = { path = "crates/xml2pdf-auto" }
roxmltree = "0.21"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
notify = "8"
tempfile = "3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Smaller WebAssembly binary for the web app.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# wasm-bindgen reads the `target_features` section, which a full strip removes.
strip = "debuginfo"

[profile.release]
lto = true
codegen-units = 1
strip = true
